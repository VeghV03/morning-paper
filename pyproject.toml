[project]
name = "morning-paper"
version = "0.1.0"
description = "A morning paper your Claude writes for you: the day's stories ranked by independent outlets, read on your phone."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "feedparser>=6.0",
  "fsrs>=6.3.3",
  "fsrs-rs-python>=0.9.3",
  "httpx>=0.27",
  "keyring>=25 ; sys_platform != 'darwin'",
  "lxml>=5.0",
  "numpy>=2.5.5",
  "onnxruntime>=1.32.0",
  "pillow>=11",
  "pyyaml>=6.0",
  "tokenizers>=0.23.3",
  "trafilatura>=2.0",
]

[project.scripts]
paper = "paper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper"]
