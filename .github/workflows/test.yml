# The tests and the installer on each system a reader may have; then, on Linux, where the cloud
# run happens, its start and finish against a data repository made here. The unit tests walk the
# phone page in the runner's Chrome (tests/test_page.py); the page on a real phone, the keychain
# prompt and a real morning run still need a real phone and the cloud.
name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash  # Git Bash on Windows, as the reader's Claude has it
    env:
      PAPER_RECOVERY_CODE: TEST-TEST-TEST-TEST-TEST-TEST
    steps:
      - uses: actions/checkout@v4

      - name: Install the paper's tools
        run: |
          scripts/install.sh
          for left in .git tests docs engine/out; do   # what the copy leaves out, on GNU tar too
            [ ! -e ~/paper/.tools/src/$left ] || { echo "copied $left"; exit 1; }
          done
          [ -f ~/paper/.tools/src/src/paper/cli.py ]

      - name: Unit tests
        run: |
          export PATH="$HOME/paper/.tools/bin:$PATH" PYTHONUTF8=1
          uv run --python 3.13 python -m unittest discover -s tests

      - name: A new home
        run: ~/paper/.tools/bin/paper init

      - name: The keyring, without the test code
        if: runner.os != 'macOS'  # the runner's keychain may wait on a prompt
        run: |
          out=$(env -u PAPER_RECOVERY_CODE PAPER_HOME="$HOME/keyring-home" ~/paper/.tools/bin/paper init 2>&1) && ok=1 || ok=0
          echo "$out"
          case "$RUNNER_OS" in
            Linux) [ $ok = 0 ] && grep -q "PAPER_RECOVERY_CODE" <<< "$out" ;;  # no Secret Service here: a refusal
            Windows) [ $ok = 1 ] ;;                                              # Credential Manager
          esac

      - name: The morning run's start and finish
        if: runner.os == 'Linux'  # the run happens only there (D45)
        run: |
          export PATH="$HOME/paper/.tools/bin:$PATH"
          data="$RUNNER_TEMP/paper-data"
          git init -q --bare -b main "$RUNNER_TEMP/origin.git"
          git clone -q "$RUNNER_TEMP/origin.git" "$data"
          export PAPER_DATA="$data" PAPER_RUN_KEY="$(paper cloud key)"
          paper cloud pack --repo "$data"        # as setup seals a new reader's files
          git -C "$data" add -A
          git -C "$data" -c user.name=setup -c user.email=setup@localhost commit -qm "The reader's files"
          git -C "$data" push -q origin HEAD:main
          export PAPER_HOME="$RUNNER_TEMP/run-home"
          scripts/cloud-run.sh start
          cmp ~/paper/sections.md "$PAPER_HOME/sections.md"
          echo "- https://example.com/" >> "$PAPER_HOME/inbox.md"  # what a run changes
          scripts/cloud-run.sh finish
          git -C "$RUNNER_TEMP/origin.git" log -1 --format=%s main | grep -qx "Issue 20[0-9-]*"
